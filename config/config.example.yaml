# Copy this file to config/config.yaml and adjust before running.

poll_interval_seconds: 5

strategies:
  - name: btc_scalp
    enabled: true
    symbol: BTCUSD.s
    timeframe: M1
    magic: 60200000
    lot: 0.02
    sl_pips: 550
    trail_start_pips: 150
    trail_distance_pips: 80
    params:
      fast_ema: 5
      slow_ema: 13

  - name: btc_m15
    enabled: true
    symbol: BTCUSD.s
    timeframe: M15
    magic: 60208000
    lot: 0.02
    sl_pips: 700
    trail_start_pips: 250
    trail_distance_pips: 120
    params:
      fast_ema: 20
      slow_ema: 50
      rsi_period: 14

  - name: ai_trader
    enabled: false
    symbol: XAUUSD
    timeframe: M15
    magic: 60300000
    lot: 0.02
    sl_pips: 5.0
    trail_start_pips: 1.0
    trail_distance_pips: 0.5
    params: {}
